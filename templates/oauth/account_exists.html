<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Exists | Cartzy</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .message-box {
            width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            text-align: center;
        }
        .icon {
            font-size: 48px;
            color: #4285f4;
            margin-bottom: 20px;
        }
        .info-box {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="icon">📧</div>
        <h2>Account Already Exists</h2>
        <p>An account with this email already exists in our system.</p>
        
        <div class="info-box">
            <strong>What to do:</strong><br>
            1. Sign in with your existing password<br>
            2. Then connect your Google account in settings<br>
            3. Or reset your password if you've forgotten it
        </div>
        
        <div>
            <a href="{% url 'login' %}" class="btn">Sign In</a>
            <a href="{% url 'password_reset' %}" class="btn" style="background-color: #17a2b8;">Reset Password</a>
            <a href="{% url 'home' %}" class="btn" style="background-color: #6c757d;">Go Home</a>
        </div>
    </div>
</body>
</html>

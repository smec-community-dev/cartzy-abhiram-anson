<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cancelled | Cartzy</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .message-box {
            width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            text-align: center;
        }
        .icon {
            font-size: 48px;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .btn {
            padding: 12px 24px;
            background-color: #4285f4;
            border: none;
            border-radius: 4px;
            color: #fff;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="icon">❌</div>
        <h2>Login Cancelled</h2>
        <p>You cancelled the Google login process. No account was created or accessed.</p>
        <div>
            <a href="{% url 'login' %}" class="btn">Try Again</a>
            <a href="{% url 'home' %}" class="btn" style="background-color: #6c757d;">Go Home</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Error | Cartzy</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .message-box {
            width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            text-align: center;
        }
        .icon {
            font-size: 48px;
            color: #ffa502;
            margin-bottom: 20px;
        }
        .error-details {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="icon">⚠️</div>
        <h2>Login Error</h2>
        <p>Something went wrong during the login process.</p>
        
        {% if error_message %}
        <div class="error-details">
            <strong>Error details:</strong><br>
            {{ error_message }}
        </div>
        {% endif %}
        
        <div>
            <a href="{% url 'login' %}" class="btn">Try Again</a>
            <a href="{% url 'home' %}" class="btn" style="background-color: #6c757d;">Go Home</a>
        </div>
    </div>
</body>
</html>

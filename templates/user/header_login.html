     <script>
// Get products from hidden field
const products = JSON.parse(document.getElementById('header-products-data').textContent);
console.log('Products loaded:', products);

// Your search functionality
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

function filterProducts(query) {
    if (!query) return [];
    return products.filter(product => 
        product.name.toLowerCase().includes(query.toLowerCase()) ||
        product.brand.toLowerCase().includes(query.toLowerCase())
    );
}


function displayResults(results) {
    searchResults.innerHTML = '';
    
    if (results.length === 0) {
        searchResults.innerHTML = '<div class="no-results">No products found</div>';
        searchResults.style.display = 'block';
        return;
    }
    
    results.forEach(product => {
        const resultItem = document.createElement('div');
        resultItem.className = 'search-result-item';
        resultItem.innerHTML = `
            <img src="${product.image_url}" alt="${product.name}">
            <div class="product-info">
                <div class="product-name">${product.name}</div>
                <div class="product-brand" style="color: #666; font-size: 0.8rem;">${product.brand}</div>
                <div class="product-price">$${product.price}</div>
            </div>
        `;
        
        resultItem.addEventListener('click', () => {
            window.location.href = `/productdetails/${product.id}`;
        });
        
        searchResults.appendChild(resultItem);
    });
    
    searchResults.style.display = 'block';
}

// Event listeners
searchInput.addEventListener('input', function() {
    const query = this.value.trim();
    const results = filterProducts(query);
    displayResults(results);
});

document.addEventListener('click', function(e) {
    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
    }
});

searchResults.addEventListener('mouseenter', function() {
    this.style.display = 'block';
});

searchInput.addEventListener('blur', function() {
    setTimeout(() => {
        if (!searchResults.matches(':hover')) {
            searchResults.style.display = 'none';
        }
    }, 200);
});
</script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Electro</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }

        .header-top {
            background-color: #800000;
            padding: 8px 0;
            color: #fff;
            font-size: 14px;
        }
        .header-top .container {
            width: 90%;
            margin: auto;
            display: flex;
            justify-content: space-between;
        }

        .header-mid {
            padding: 15px 0;
            width: 90%;
            margin: auto;
            display: flex;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #800000;
            display: flex;
            align-items: center;
        }

        .header-bottom {
            background-color: #5a1d16;
            padding: 12px 0;
        }

        .nav {
            width: 90%;
            margin: auto;
            display: flex;
            gap: 28px;
            color: #fff;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
        }

        .register-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 50px 0;
        }

        .register-box {
            width: 900px;
            background: #fff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .register-box h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .two-columns {
            display: flex;
            gap: 30px;
        }

        .column {
            width: 50%;
        }

        .input-group {
            margin-top: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #800000;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 17px;
            margin-top: 25px;
            cursor: pointer;
        }

        .register-btn:hover {
            background-color: #a10000;
        }

        .bottom-text {
            margin-top: 15px;
            text-align: center;
        }

        .bottom-text a {
            color: #800000;
            text-decoration: none;
            font-weight: 500;
        }
    </style>

</head>

<body>

    <div class="header-top">
        <div class="container">
            <div>Help / Support / Contact</div>
            <div>Call Us: (+012) 1234 567890</div>
        </div>
    </div>

    <div class="header-mid">
        <div class="logo">🛒 Electro</div>
    </div>

    <div class="header-bottom">
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Contact</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>
    </div>

    <div class="register-wrapper">
        <div class="register-box">
            <h2>Create Your Account</h2>

            <form action="" method="POST">
                {% csrf_token %}

                <div class="two-columns">

                    <!-- LEFT COLUMN -->
                    <div class="column">

                        <div class="input-group">
                            <label>First Name</label>
                            <input type="text" name="firstname" placeholder="Enter first name" required>
                        </div>

                        <div class="input-group">
                            <label>Email Address</label>
                            <input type="email" name="email" placeholder="Enter email" required>
                        </div>

                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" name="password" placeholder="Enter password" required>
                        </div>

                    </div>

                    <!-- RIGHT COLUMN -->
                    <div class="column">

                        <div class="input-group">
                            <label>Last Name</label>
                            <input type="text" name="lastname" placeholder="Enter last name" required>
                        </div>

                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" name="username" placeholder="Enter username" required>
                        </div>

                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="text" name="phone" placeholder="Enter phone number" required>
                        </div>

                        <div class="input-group">
                            <label>Confirm Password</label>
                            <input type="password" name="confirm-password" placeholder="Confirm password" required>
                        </div>

                    </div>

                </div>

                <button class="register-btn">Register</button>

                <div class="bottom-text">
                    Already have an account? <a href="#">Login</a>
                </div>

            </form>

        </div>
    </div>

</body>

</html>

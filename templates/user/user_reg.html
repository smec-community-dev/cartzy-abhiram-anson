<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Electro</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }       

        .register-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 50px 0;
        }

        .register-box {
            width: 900px;
            background: #fff;
            padding: 35px;
            border-radius: 3px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.9);
        }

        .register-box h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .two-columns {
            display: flex;
            gap: 30px;
        }

        .column {
            width: 50%;
        }

        .input-group {
            margin-top: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 15px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #800000;
            border: none;
            border-radius: 3px;
            color: #fff;
            font-size: 17px;
            margin-top: 25px;
            cursor: pointer;
        }

        .register-btn:hover {
            background-color: #a10000;
        }

        .bottom-text {
            margin-top: 15px;
            text-align: center;
        }

        .bottom-text a {
            color: #800000;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="/static/lib/animate/animate.min.css" rel="stylesheet">
    <link href="/static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">


    <!-- Customized Bootstrap Stylesheet -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="/static/css/style.css" rel="stylesheet">

</head>

<body>

     <!-- Topbar Start -->
    <div class="container-fluid px-5 d-none border-bottom d-lg-block">
        <div class="row gx-0 align-items-center">
            <div class="col-lg-4 text-center text-lg-start mb-lg-0">
                <div class="d-inline-flex align-items-center" style="height: 45px;">
                    <a href="#" class="text-muted me-2"> Help</a><small> / </small>
                    <a href="#" class="text-muted mx-2"> Support</a><small> / </small>
                    <a href="#" class="text-muted ms-2"> Contact</a>

                </div>
            </div>
            <div class="col-lg-4 text-center d-flex align-items-center justify-content-center">
                <small class="text-dark">Call Us:</small>
                <a href="#" class="text-muted">+91 773 6299 405</a>
            </div>

            
        </div>
    </div>
    <div class="container-fluid px-5 py-4 d-none d-lg-block">
        <div class="row gx-0 align-items-center text-center">
            <div class="col-md-4 col-lg-3 text-center text-lg-start">
                <div class="d-inline-flex align-items-center">
                    <a href="" class="navbar-brand p-0">
                        <h1 class="display-5 text-primary m-0"><i
                                class="fas fa-shopping-bag text-secondary me-2"></i>CARTZY</h1>
                        <!-- <img src="img/logo.png" alt="Logo"> -->
                    </a>
                </div>
            </div>
            
            <div class="col-md-4 col-lg-3 text-center text-lg-end">
                
            </div>
        </div>
    </div>
    <!-- Topbar End -->

    <!-- Navbar & Hero Start -->
    <div class="container-fluid nav-bar p-0">
        <div class="row gx-0 bg-primary px-5 align-items-center">
            <div class="col-lg-3 d-none d-lg-block">
                
            </div>
            <div class="col-12 col-lg-9">
                <nav class="navbar navbar-expand-lg navbar-light bg-primary ">
                    <a href="" class="navbar-brand d-block d-lg-none">
                        <h1 class="display-5 text-secondary m-0"><i
                                class="fas fa-shopping-bag text-white me-2"></i>Cartzy</h1>
                        <!-- <img src="img/logo.png" alt="Logo"> -->
                    </a>
                    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarCollapse">
                        <span class="fa fa-bars fa-1x"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarCollapse">
                        <div class="navbar-nav ms-auto py-0">
                            <a href="{% url 'home' %}" class="nav-item nav-link " style="color:white">Home</a>
                            <a href="{% url '/login/' %}" class="nav-item nav-link " style="color:white">Login</a>
                            
                            
                            
                            </div>
                        <a   class="btn btn-secondary rounded-pill py-2 px-4 px-lg-3 mb-3 mb-md-3 mb-lg-0"><i
                                class="fa fa-mobile-alt me-2"></i> +91 773 6299 405</a>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <!-- Navbar & Hero End -->

   

    <div class="register-wrapper">
        <div class="register-box">
            <h2>Create Your Account</h2>

            <form action="" method="POST">
                {% csrf_token %}

                <div class="two-columns">

                    <!-- LEFT COLUMN -->
                    <div class="column">

                        <div class="input-group">
                            <label>First Name</label>
                            <input type="text" name="firstname" placeholder="Enter first name" required>
                        </div>

                        <div class="input-group">
                            <label>Email Address</label>
                            <input type="email" name="email" placeholder="Enter email" required>
                        </div>

                        <div class="input-group">
                            <label>Username</label>
                            <input type="text" name="username" placeholder="Enter userrname" required>
                        </div>

                    </div>

                    <!-- RIGHT COLUMN -->
                    <div class="column">

                        <div class="input-group">
                            <label>Last Name</label>
                            <input type="text" name="lastname" placeholder="Enter last name" required>
                        </div>

                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="text" name="phone" placeholder="Enter phone number" required>
                        </div>

                        <div class="input-group">
                            <label>Password</label>
                            <input type="password" name="password" placeholder="Enter password" required>
                        </div>

                        <div class="input-group">
                            <label>Confirm Password</label>
                            <input type="password" name="confirm-password" placeholder="Confirm password" required>
                        </div>

                    </div>

                </div>

                <button class="register-btn">Register</button>

                <div class="bottom-text">
                    Already have an account? <a href="{% url '/login/' %}">Login</a>
                </div>

            </form>

        </div>
    </div>

</body>

{% include 'user/footer.html' %}

</html>

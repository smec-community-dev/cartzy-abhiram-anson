<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Electro</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }

        /* Top Bar */
        .header-top {
            background-color: #800000;
            padding: 8px 0;
            color: #fff;
            font-size: 14px;
        }
        .header-top .container {
            width: 90%;
            margin: auto;
            display: flex;
            justify-content: space-between;
        }
        .header-top a {
            color: #fff;
            text-decoration: none;
        }

        /* Logo + Search Area */
        .header-mid {
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin: auto;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #800000;
            display: flex;
            align-items: center;
        }
        .logo i {
            font-size: 30px;
            margin-right: 10px;
        }

        /* Navbar Bottom */
        .header-bottom {
            background-color: #5a1d16;
            padding: 12px 0;
        }
        .nav {
            width: 90%;
            margin: auto;
            display: flex;
            gap: 28px;
            color: #fff;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
        }

        /* LOGIN BOX */
        .login-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 60px;
            margin-bottom: 60px;
        }

        .login-box {
            width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            color: #333;
        }

        .input-group {
            margin-top: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #800000;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 17px;
            margin-top: 25px;
            cursor: pointer;
            font-weight: 500;
        }

        .login-btn:hover {
            background-color: #a10000;
        }

        .bottom-text {
            margin-top: 15px;
            text-align: center;
        }

        .bottom-text a {
            color: #800000;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- ================= TOP HEADER ================= -->
    <div class="header-top">
        <div class="container">
            <div>Help / Support / Contact</div>
            <div>Call Us: (+012) 1234 567890</div>
        </div>
    </div>

    <!-- ================= MID HEADER ================= -->
    <div class="header-mid">
        <div class="logo">
            <i>🛒</i> Electro
        </div>
    </div>

    <!-- ================= NAVBAR ================= -->
    <div class="header-bottom">
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Single Page</a>
            <a href="#">Contact</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>
    </div>

    <!-- ================= LOGIN BOX ================= -->
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Login to Your Account</h2>

            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="text" name = "username" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name= 'password' placeholder="Enter password" required>
                </div>

                <button class="login-btn">Login</button>

                <div class="bottom-text">
                    Don’t have an account? <a href="#">Register Now</a>
                </div>
            </form>

        </div>
    </div>

</body>
</html>

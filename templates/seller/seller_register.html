<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Cartzy</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="header">
  <div class="logo">Cartzy</div>

  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger">☰</label>

  <nav class="nav">
    <a href="/">Home</a>
    <a href="/products/">Products</a>
    <a href="/wishlist/">Wishlist</a>
    <a href="/account/">Account</a>
  </nav>

  <a href="/cart/" class="cart-icon">🛒</a>
</header>

<section class="auth-page">
  <div class="auth-container">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Join Cartzy Store today</p>

    {% if messages %}
      <div class="message-box">
        {% for message in messages %}
          <div class="alert 
            {% if message.tags == 'error' %}
               alert-error
            {% else %}
               alert-success
            {% endif %}
          ">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form class="auth-form" method="POST" action="/seller/register/">
  {% csrf_token %}

  <div class="form-group">
    <label for="firstname">First Name</label>
    <input type="text" id="firstname" name="firstname" placeholder="John" required>
  </div>

  <div class="form-group">
    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" name="lastname" placeholder="Doe" required>
  </div>

  <div class="form-group">
    <label for="fullname">Username</label>
    <input type="text" id="fullname" name="username" placeholder="johndoe123" required>
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
  </div>

  <div class="form-group">
    <label for="phone">Contact Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
  </div>

  <div class="form-group">
    <label for="shop_name">Shop Name</label>
    <input type="text" id="shop_name" name="shop_name" placeholder="Cartzy Store" required>
  </div>

  <div class="form-group">
    <label for="gst_number">GST Number (optional)</label>
    <input type="text" id="gst_number" name="gst_number" placeholder="GSTINXXXXX">
  </div>

  <div class="form-group">
    <label for="address">Address</label>
    <textarea id="address" name="address" placeholder="Full shop address..." required></textarea>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
  </div>

  <div class="form-group">
    <label for="confirm-password">Confirm Password</label>
    <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter password" required>
  </div>

  <div class="form-options">
    <label class="remember-me">
      <input type="checkbox" id="terms" required>
      <span>I agree to the Terms & Conditions</span>
    </label>
  </div>

  <button type="submit" class="btn auth-submit">Create Account</button>

  <p class="auth-switch">
    Already have an account? <a href="/seller/login/">Sign In</a>
  </p>
</form>


    <div class="auth-divider">
      <span>or sign up with</span>
    </div>

    <div class="social-auth">
      <button type="button" class="social-btn">
        <span>🔵</span> Google
      </button>
      <button type="button" class="social-btn">
        <span>📘</span> Facebook
      </button>
    </div>
  </div>
</section>

</body>
</html>

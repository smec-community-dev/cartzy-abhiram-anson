<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Electro</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }

        /* Top Bar */
        .header-top {
            background-color: #800000;
            padding: 8px 0;
            color: #fff;
            font-size: 14px;
        }
        .header-top .container {
            width: 90%;
            margin: auto;
            display: flex;
            justify-content: space-between;
        }
        .header-top a {
            color: #fff;
            text-decoration: none;
        }

        /* Logo Area */
        .header-mid {
            padding: 15px 0;
            width: 90%;
            margin: auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #800000;
            display: flex;
            align-items: center;
        }
        .logo i {
            font-size: 30px;
            margin-right: 10px;
        }

        /* Navbar */
        .header-bottom {
            background-color: #5a1d16;
            padding: 12px 0;
        }
        .nav {
            width: 90%;
            margin: auto;
            display: flex;
            gap: 28px;
            color: #fff;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
        }

        /* REGISTER WRAPPER */
        .register-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 50px 0;
        }

        .register-box {
            width: 900px;
            background: #fff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .register-box h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
        }

        .two-columns {
            display: flex;
            gap: 30px;
        }

        .column {
            width: 50%;
        }

        .input-group {
            margin-top: 18px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #800000;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
        }

        .register-btn:hover {
            background-color: #a10000;
        }

        .bottom-text {
            margin-top: 15px;
            text-align: center;
        }

        .bottom-text a {
            color: #800000;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- ================= TOP HEADER ================= -->
    <div class="header-top">
        <div class="container">
            <div>Help / Support / Contact</div>
            <div>Call Us: (+012) 1234 567890</div>
        </div>
    </div>

    <!-- ================= LOGO ================= -->
    <div class="header-mid">
        <div class="logo">
            <i>🛒</i> Electro
        </div>
    </div>

    <!-- ================= NAVBAR ================= -->
    <div class="header-bottom">
        <div class="nav">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Single Page</a>
            <a href="#">Contact</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>
    </div>

    <!-- ================= REGISTER BOX ================= -->
    <div class="register-wrapper">
        <div class="register-box">
            <h2>Create Your Account</h2>

    <form  method="POST">
    {% csrf_token %}

    <div class="two-columns">

        <!-- LEFT COLUMN -->
        <div class="column">

            <h3 style="color:#800000; margin-bottom:5px;">User Details</h3>

            <div class="input-group">
                <label>First Name</label>
                <input type="text" name="firstname" placeholder="Enter first name" required>
            </div>

            <div class="input-group">
                <label>Last Name</label>
                <input type="text" name="lastname" placeholder="Enter last name" required>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phone" placeholder="Enter phone number" required>
            </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="column">

            <h3 style="color:#800000; margin-bottom:5px;">Seller & Address Details</h3>

            <div class="input-group">
                <label>Shop Name</label>
                <input type="text" name="shop_name" placeholder="Enter shop name" required>
            </div>

            <div class="input-group">
                <label>GST Number (Optional)</label>
                <input type="text" name="gst_number" placeholder="GSTINXXXXX">
            </div>

            <div class="input-group">
                <label>Address</label>
                <textarea name="address" placeholder="Full shop address..." required></textarea>
            </div>

        </div>

    </div>

    <button class="register-btn" type="submit">Register</button>

    <div class="bottom-text">
        Already have an account? <a href="/seller/login/">Login</a>
    </div>

</form>


        </div>
    </div>

</body>

</html>

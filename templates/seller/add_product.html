


<div class="container py-5">

    <!-- Heading -->
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Add New Product</h1>
        <p class="text-muted">Fill the details below to add a new product to your store</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form action="" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">

                    <!-- LEFT COLUMN -->
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Enter product name" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Brand (optional)</label>
                            <input type="text" name="brand" class="form-control" placeholder="Brand name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" name="price" class="form-control" placeholder="Enter price" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" name="stock" class="form-control" placeholder="Stock qty" required>
                        </div>
                        
                        
                    </div>

                    <!-- RIGHT COLUMN -->
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                <option value="" disabled selected>Select category</option>
                                {% for cat in category %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Product Images</label>
                            <input type="file" name="images" class="form-control" multiple required>
                            <small class="text-muted">You can upload multiple images</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Main Image Index</label>
                            <input type="number" name="main_image" class="form-control" value="0" min="0">
                            <small class="text-muted">Specify which uploaded image is the main image (0-based index)</small>
                        </div>

                    </div>

                    <!-- FULL WIDTH DESCRIPTION -->
                    <div class="col-12">
                        <div class="mb-3">
                            <label class="form-label">Product Description</label>
                            <textarea name="description" class="form-control" rows="5" placeholder="Write product description..." required></textarea>
                        </div>
                    </div>

                </div>

                <!-- Submit button -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary rounded-pill px-5 py-2">
                        <i class="fas fa-save me-2"></i>Add Product
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

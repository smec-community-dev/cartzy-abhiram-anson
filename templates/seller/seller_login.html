<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Cartzy</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="header">
  <div class="logo">CARTZY</div>

  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger">☰</label>

  <nav class="nav">
    <a href="/">Home</a>
    <a href="/products/">Products</a>
    <a href="/wishlist/">Wishlist</a>
    <a href="/account/">Account</a>
  </nav>

  <a href="/cart/" class="cart-icon">🛒</a>
</header>

<section class="auth-page">
  <div class="auth-container">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Login to your account</p>

    <!-- Django messages -->
    {% if messages %}
      <div class="message-box">
        {% for message in messages %}
          <div class="alert 
            {% if message.tags == 'error' %}
               alert-error
            {% else %}
               alert-success
            {% endif %}
          ">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form class="auth-form" method="POST" action="/seller/login/">
        {% csrf_token %}

      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="your username" 
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password" 
          required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn auth-submit">Login</button>

      <p class="auth-switch">
        Don't have an account? 
        <a href="/seller/register/">Create one</a>
      </p>
    </form>

    <div class="auth-divider">
      <span>or continue with</span>
    </div>

    <div class="social-auth">
      <button class="social-btn">
        <span>🔵</span> Google
      </button>
      <button class="social-btn">
        <span>📘</span> Facebook
      </button>
    </div>
  </div>
</section>

</body>
</html>
